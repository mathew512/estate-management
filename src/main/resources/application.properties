# Application Server Config
server.port=8080

# Spring Boot 3 Java 21 Virtual Threads
spring.threads.virtual.enabled=true

# Database Connection (PostgreSQL running in Docker on port 5433)
spring.datasource.url=jdbc:postgresql://localhost:5433/estatedb
spring.datasource.username=postgres
spring.datasource.password=your_secure_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# Flyway Settings
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# JWT Config
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-at-least-32-characters-for-hs256}
app.jwt.expiration-ms=3600000

# M-Pesa (Daraja) - values come from environment variables, never commit real keys
mpesa.base-url=https://sandbox.safaricom.co.ke
mpesa.consumer-key=${MPESA_CONSUMER_KEY:}
mpesa.consumer-secret=${MPESA_CONSUMER_SECRET:}
mpesa.shortcode=${MPESA_SHORTCODE:174379}
mpesa.passkey=${MPESA_PASSKEY:}
mpesa.callback-url=${MPESA_CALLBACK_URL:}
mpesa.callback-secret=${MPESA_CALLBACK_SECRET:}

# Notifications outbox sender
notifications.poll-interval-ms=10000
notifications.max-attempts=5
notifications.batch-size=20

# Name used in the signature of tenant messages
app.company-name=Kasa Estate

# SMS provider: "log" (development, prints to the server log) or "africastalking"
notifications.sms.provider=${SMS_PROVIDER:log}
africastalking.username=${AT_USERNAME:sandbox}
africastalking.api-key=${AT_API_KEY:}
africastalking.sender-id=${AT_SENDER_ID:}

# Email provider: "log" (development) or "smtp"
notifications.email.provider=${EMAIL_PROVIDER:log}
notifications.email.from=${EMAIL_FROM:}

# Never let a slow mail server hang the sender thread
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Keep /actuator/health about our app, not the mail server
management.health.mail.enabled=false

# Rate limiting (all limits are per window)
ratelimit.window-minutes=15
ratelimit.login.max-attempts-per-ip=20
ratelimit.login.max-attempts-per-account=5
ratelimit.reset.max-requests-per-ip=10

# "none" uses the direct connection address. Behind a reverse proxy or load balancer, set
# FORWARD_HEADERS_STRATEGY=native, or every user shares the proxy's address and one limit.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}