# Application Server Config
server.port=8080

# Spring Boot 3 Java 21 Virtual Threads
spring.threads.virtual.enabled=true

# Database Connection (PostgreSQL running in Docker on port 5433)
spring.datasource.url=jdbc:postgresql://localhost:5433/estatedb
spring.datasource.username=postgres
spring.datasource.password=your_secure_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Settings
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# JWT Config
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-at-least-32-characters-for-hs256}
app.jwt.expiration-ms=3600000