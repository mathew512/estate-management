# Tests run against their own database, never the real one. The username and password
# are inherited from application.properties.
spring.datasource.url=jdbc:postgresql://localhost:5433/estatedb_test

# Tests must never send anything for real
notifications.sms.provider=log
notifications.email.provider=log

# The sender polls on startup; keep it quiet afterwards so tests control the outbox
notifications.poll-interval-ms=3600000
